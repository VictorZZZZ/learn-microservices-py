# Единая точка входа (API gateway) микросервисного приложения:
# маршрутизация запросов к сервисам + централизованная документация API.
# Запускается в Docker-контейнере — см. README.md и docker-compose.yml.
#
# Порты: nginx слушает 8080 ВНУТРИ контейнера; порт машины (7777)
# задаётся маппингом Docker: "7777:8080" в docker-compose.yml
# или флагом -p 7777:8080.
#
# Сервисы приложения запускаются на машине-хосте (uvicorn), поэтому
# адресуются через host.docker.internal: изнутри контейнера 127.0.0.1
# означал бы сам контейнер, а Docker Desktop резолвит
# host.docker.internal в машину-хост.
#
#   :8000 — orchestrator (сервис оркестрации, BFF)
#   :8001 — auth-service
#   :8002 — catalog-service
#   :8003 — profile-service

worker_processes  1;

# логи — в stdout/stderr контейнера, смотреть через `docker logs gateway`
error_log  /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    default_type  application/json;

    access_log  /dev/stdout;

    sendfile           on;
    keepalive_timeout  65;

    # --- upstream'ы сервисов на машине-хосте.
    # Именованные блоки удобны, когда позже сервисов одного вида станет
    # несколько: достаточно добавить вторую server-строку — и nginx
    # начнёт балансировать нагрузку между ними.

    upstream orchestrator    { server host.docker.internal:8000; }  # BFF (оркестрация)
    upstream auth_service    { server host.docker.internal:8001; }
    upstream catalog_service { server host.docker.internal:8002; }
    upstream profile_service { server host.docker.internal:8003; }

    server {
        listen       8080;
        server_name  localhost;

        # Стандартные заголовки проксирования, чтобы сервисы видели
        # исходные Host/IP-клиента, а не адрес контейнера (аналог
        # forward-headers-strategy в Spring Boot за reverse proxy)
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;

        # --- оркестратор: /api/** -> :8000/**
        # срезается только префикс /api, оркестратор видит «свои» пути:
        # /api/dashboard -> /dashboard
        location /api/ {
            proxy_pass http://orchestrator/;
        }

        # --- auth: /auth/** -> :8001/**
        # срезается только префикс сервиса, остальной путь без изменений:
        # /auth/v1/auth/login -> /v1/auth/login
        location /auth/ {
            proxy_pass http://auth_service/;
        }

        # --- catalog: /catalog/** -> :8002/**
        # /catalog/v1/products -> /v1/products
        location /catalog/ {
            proxy_pass http://catalog_service/;
        }

        # --- profile: /profile/** -> :8003/**
        # /profile/v1/user-profile -> /v1/user-profile
        location /profile/ {
            proxy_pass http://profile_service/;
        }

        # --- документация API (Redoc): единая страница для всех сервисов.
        # Статика лежит в api-docs/site (маппинг — в docker-compose.yml).
        # Спецификации сервисы отдают живьём; проксируем их через те же
        # upstream'ы — страница и JSON в одном origin (:7777), без CORS.

        location /docs/ {
            alias /usr/share/nginx/html/api-docs/;
            index index.html;
        }

        location = /openapi/auth.json    { proxy_pass http://auth_service/openapi.json; }
        location = /openapi/catalog.json { proxy_pass http://catalog_service/openapi.json; }
        location = /openapi/profile.json { proxy_pass http://profile_service/openapi.json; }

        # когда появится оркестратор — раскомментировать и добавить
        # запись в APIS в api-docs/site/index.html:
        # location = /openapi/orchestrator.json { proxy_pass http://orchestrator/openapi.json; }
    }
}
